name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest

    - name: Run Tests
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/

    - name: Sanity Scan for Leakage
      run: |
        if grep -r -i -E "lucayunxiao|ironpeach|ironluca|192\.168\." app/; then
          echo "Sensitive personal data detected in app/!"
          exit 1
        fi

    - name: Build Docker Image
      run: |
        docker build -t ironchat:test .
