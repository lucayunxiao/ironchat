services:
  ironchat:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ironchat
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8088"
    volumes:
      - ../data:/app/data
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/manifest.json"]
      interval: 30s
      timeout: 5s
      retries: 3
